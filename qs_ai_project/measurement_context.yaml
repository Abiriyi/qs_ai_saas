# Default measurement context for BoQ generation fallback
# Currency: Nigerian Naira (₦)
# Default locations: Kaduna, Abuja, Kano, Lagos, Port-Harcourt

scale: 0.01
storey_height: 3.0
wall_thickness: 0.225
slab_thickness: 0.15

# Foundation excavation defaults
foundation:
  excavation_depth: 1.0
  excavation_width: 0.69
  footing_thickness: 0.225
  footing_width: 0.45
  concrete_grade: "C25"
  mix_ratio: "1:2:4"

# Currency and location settings
currency: "NGN"
currency_symbol: "₦"
default_locations:
  - "Kaduna"
  - "Abuja"
  - "Kano"
  - "Lagos"
  - "Port-Harcourt"
default_location: "Kaduna"

# Trade-based BoQ default items
