{% extends 'base.html' %}

{% block title %}Password updated | QS AI{% endblock %}

{% block content %}
<section class="auth-screen">
  <div class="container auth-layout">
    <div class="auth-card">
      <h2>Password updated</h2>
      <p class="signin-hint">
        Your password has been set. You can now sign in with your new password.
      </p>
      <a href="{% url 'login' %}" class="btn btn-primary full-width">Sign in</a>
    </div>
  </div>
</section>
{% endblock %}
